# SAM.gov Opportunity Tracker settings.
# Changes apply on the next run, no restart needed.

# Keywords to look for.
#   keyword: weight                              -> searched in title and description
#   keyword: {weight: 1, title_only: true}       -> searched in the title only
#                                                   (for words too common in descriptions)
# A keyword found in the title counts double.
# Matching is whole word, case insensitive. "web design" also matches "web-design".
keywords:
  # Core marketing / communication
  marketing: 1          # generic word, often in boilerplate ("marketing materials")
  digital marketing: 2
  strategic communications: 2
  strategic communication: 2
  public affairs: 1
  public relations: 2
  branding: 2
  brand strategy: 2
  brand identity: 2
  marketing campaign: 2
  marketing services: 2
  advertising: 1        # generic word, often in boilerplate ("commercial advertising" clause)
  advertising services: 1
  media buying: 2
  media campaign: 2
  awareness campaign: 2
  public awareness: 1
  outreach: {weight: 1, title_only: true}
  community outreach: 1

  # Digital
  social media: 2
  social media management: 1
  content marketing: 2
  content creation: 2
  content strategy: 2
  email marketing: 2
  seo: 2
  search engine optimization: 2
  digital media: 1
  digital advertising: 2
  influencer: 1
  copywriting: 2

  # Design / web
  graphic design: 2
  graphic designer: 2
  creative services: 2
  web design: 2
  web designer: 2
  web designing: 2
  webdesign: 2
  web development: 2
  web developer: 2
  web redesign: 2
  website: {weight: 1, title_only: true}
  website design: 2
  website designer: 2
  website development: 2
  website redesign: 2
  website modernization: 2
  web portal: 1
  web application: 1
  web applications: 1
  web app: 1
  landing page: {weight: 1, title_only: true}   # "see landing page" is common boilerplate
  wordpress: 2
  drupal: 2
  content management system: 1
  front end development: 2      # also matches "front-end development"
  frontend development: 2

  # Web development (added): a dash also matches a space, so one line covers both spellings
  web developers: 2
  web development services: 1
  website maintenance: 2
  web maintenance: 2
  website support: 2
  website hosting: {weight: 2, title_only: true}
  web hosting: {weight: 2, title_only: true}   # IT boilerplate in descriptions
  website content: 1
  web content: 1
  web content management: 2
  website migration: 2
  website accessibility: 2
  web accessibility: 2
  section 508: {weight: 1, title_only: true}   # in almost every IT description
  responsive design: 2
  mobile responsive: 1
  user interface development: 2
  front end developer: 2        # also matches "front-end developer"
  back end development: 1       # also "back-end development"
  full stack: 2                 # "full stack" and "full-stack developer"
  web services: {weight: 1, title_only: true}
  web based application: 1      # also "web-based application"
  web platform: {weight: 1, title_only: true}
  web portal development: 2
  portal development: 1
  intranet: {weight: 1, title_only: true}
  sharepoint: {weight: 1, title_only: true}
  sharepoint development: 2
  e-commerce: {weight: 2, title_only: true}   # DLA parts orders all mention its "e-commerce" site
  ecommerce: {weight: 2, title_only: true}
  online store: 2
  html: {weight: 1, title_only: true}
  javascript: 1
  typescript: 1
  reactjs: 2
  react.js: 2
  angularjs: 1
  vue.js: 1
  node.js: 1
  php: {weight: 1, title_only: true}
  django: 1
  api development: 1
  headless cms: 2
  sitecore: 2
  adobe experience manager: 2
  webflow: 2
  squarespace: 2
  wix: {weight: 1, title_only: true}
  web analytics: 2
  google analytics: 2
  usability testing: 2
  user research: 1
  digital experience: 1
  webmaster: {weight: 2, title_only: true}

  # Software design
  software design: 2
  software designer: 2
  software development: 1       # broad IT term, very common
  software developer: 1
  application design: 2
  application development: 1
  app design: 2
  app development: 2
  mobile app: 1
  mobile application development: 2
  digital design: 2
  digital services: 1
  visual design: 2
  interaction design: 2
  user interface: 1
  user interface design: 2
  ux design: 2
  ui design: 2
  ui/ux: 2
  ux/ui: 2
  user experience: 1
  human centered design: 2      # also matches "human-centered design"
  multimedia: 1
  video production: 1

# Offers whose TITLE contains one of these words are filtered out.
exclude_keywords:
  - radio
  - telecommunication
  - telecommunications
  - command
  - control

# Notice types you can no longer answer (contract already awarded).
# Hidden by default, like offers whose deadline has passed.
closed_types:
  - Award Notice
  - Justification

# Minimum score to keep an offer.
# Example: a weight-2 keyword in the description alone = 2 -> kept.
min_score: 2

# Offers posted in the last N days are read, plus older offers that are still
# open (deadline not passed, not archived).
days_back: 30

# Offers the tool filtered out are deleted after this many days, to keep the
# database small. Offers you discarded, restored or kept by hand are never deleted.
keep_filtered_days: 90

# Public daily CSV of SAM.gov contract opportunities (no account or key needed).
csv_url: "https://falextracts.s3.amazonaws.com/Contract%20Opportunities/datagov/ContractOpportunitiesFullCSV.csv"
