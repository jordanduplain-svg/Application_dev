# Config electron-builder — production du .exe Windows.
appId: com.perso.candidatures
productName: Candidatures

# pnpm hoist `electron` dans le node_modules RACINE (pas apps/desktop/node_modules) ;
# avec une version en plage (^34) electron-builder ne peut pas la déduire et échoue
# (« Cannot compute electron version »). On la fixe explicitement ici — à mettre à jour
# si on change la version d'Electron (cf. devDependencies : electron ^34.0.0 → 34.5.8 installé).
electronVersion: 34.5.8

directories:
  output: dist
  buildResources: build

# MAJ-AUTO : flux de mise à jour (electron-updater lit latest.yml depuis les
# GitHub Releases du dépôt). electron-builder génère latest.yml au build ; il faut
# publier une Release avec le .exe + latest.yml (ex. `electron-builder --win --publish always`
# avec GH_TOKEN) pour que les clients installés se mettent à jour. Sans release, l'app
# ne fait rien (la vérification échoue silencieusement).
publish:
  provider: github
  owner: jordanduplain-svg
  repo: Application-dev

# Fichiers de l'app à empaqueter. Les node_modules de production sont copiés
# automatiquement ; on n'ajoute ici que ce qu'electron-builder ne détecte pas.
files:
  - out/**/*
  - package.json
  # .prisma/client = client Prisma généré (code + moteur natif). Ce dossier
  # n'est pas un "package" npm → electron-builder ne le copie pas tout seul.
  - node_modules/.prisma/**/*

# Le schéma et les migrations sont lus au 1er lancement (prisma migrate deploy).
# Placés hors de l'asar, dans resources/, donc lisibles directement sur disque.
extraResources:
  - from: prisma
    to: prisma

# Doivent rester hors de l'archive asar :
#  - les binaires natifs (.node), dont le moteur de requête Prisma ;
#  - le CLI Prisma, qu'on exécute en sous-process pour les migrations.
asarUnpack:
  - "**/*.node"
  - node_modules/.prisma/**
  - node_modules/@prisma/engines/**
  - node_modules/prisma/**

win:
  target:
    - nsis
  # Icône de l'app — déposez votre fichier dans build/icon.ico.
  # Sans icône, electron-builder utilise l'icône Electron par défaut.
  icon: build/icon.ico

nsis:
  oneClick: false # Laisse choisir le dossier d'installation
  perMachine: false # Installation par utilisateur — aucun droit admin requis
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true # Raccourci sur le bureau, comme demandé
