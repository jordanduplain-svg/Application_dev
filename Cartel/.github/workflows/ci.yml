# Verrou d'intégration : les tests, la porte du jalon 0 (le levier) ET l'équilibrage (§16)
# doivent rester verts. Une régression d'équilibrage (mortalité qui s'envole, domination d'un
# bot) casse ici, plus en douce.
#
# Depuis le portage TypeScript (§13), tout tourne sous Node : aucun binaire à télécharger, et
# Node exécute le TypeScript directement (suppression des types, sans compilation).
name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Dépendances (vérificateur de types seulement)
        run: npm ci

      # Node retire les types sans les vérifier : sans cette étape, une erreur de type ne se
      # verrait qu'au jour où elle produit un mauvais nombre.
      - name: Vérification des types
        run: npx tsc --noEmit -p .

      # Le détail de ce que couvre run.ts s'imprime à chaque exécution ; le recopier ici
      # produirait une liste périmée.
      - name: Tests logiques (le detail s'imprime, il n'est pas recopie ici)
        run: node src/tests/run.ts

      # LA porte du jalon 0 (§15) : chaque constante de data/ bouge quelque chose. Elle passe
      # AVANT l'équilibrage : mesurer avec un levier débranché, c'est équilibrer dans le vide.
      - name: Levier connecte (chaque constante a +/-30 %)
        run: node src/tests/levier.ts

      # §16 « Vitesse du harnais » : un harnais qui ralentit d'un facteur 50 ne casse rien, il
      # rend l'équilibrage impraticable en silence. Budgets larges — on attrape un ordre de
      # grandeur perdu, pas la météo du runner.
      - name: Vitesse du harnais (extrapolation des deux boucles)
        run: node src/tests/perf.ts

      # DEROGATION DATEE — jalon: 2
      #
      # Les cibles de §16 sont écrites et armées dans balance.ts, qui sort en 1 quand elles
      # ratent. Deux ratent aujourd'hui, et §16 dit POURQUOI : tout ce qui existe à l'acte I
      # est lisse, donc la mortalité est une falaise et jamais une distribution. Il manque au
      # jeu un risque GRUMELEUX — les saisies et les descentes (§3bis, §7), qui arrivent au
      # jalon 2. Aucun réglage ne les remplace.
      #
      # AUCUN CHIFFRE MESURÉ ICI : le chiffre du jour s'obtient en lançant l'étape. La ligne
      # `jalon:` ci-dessus est lue par src/tests/run.ts et confrontée à `Levier.JALON_COURANT`,
      # comme les dormantes du levier : une dérogation sans date est une suppression.
      - name: Harnais d'equilibrage (les cibles de §16 — mesure, derogation jusqu'au jalon 2)
        continue-on-error: true
        run: node src/tests/balance.ts

      # Les OUTILS ne rendent aucun verdict et ne sont donc gardés par rien : une erreur y
      # dormirait jusqu'au jour où on les ouvre — le jour où l'étape du dessus rougit. On ne
      # vérifie pas ce qu'ils impriment, seulement qu'ils tournent.
      - name: Smoke des outils (trace, balayage, comparer)
        run: |
          node src/tests/trace.ts 1 discret 52
          node src/tests/trace.ts 1 discret 52 blanchiment.taux 0.7 3
          node src/tests/balayage.ts marche.inertie 0.1 0.3 2 4
          node src/tests/comparer.ts levier.csv levier.csv
          # Comparer un fichier à LUI-MÊME ne sort que par le « aucun changement » : on
          # fabrique une mesure différente et on EXIGE les trois blocs. Colonnes adressées
          # PAR NOM, lues dans l'en-tête : une colonne absente = échec bruyant.
          awk -F, -v OFS=, '
            NR==1 { for (i=1;i<=NF;i++) col[$i]=i
                    if (!("valeur" in col) || !("statut" in col) || !("amplitude" in col)) {
                      print "smoke : colonne attendue absente de levier.csv" > "/dev/stderr"
                      exit 1 }
                    print; next }
            NR==2 { $col["valeur"]=$col["valeur"]*1.5; $col["statut"]="DEBRANCHEE"
                    $col["amplitude"]=$col["amplitude"]*2 }
                  { print }' levier.csv > modifie.csv
          node src/tests/comparer.ts levier.csv modifie.csv | tee sortie.txt
          grep -q "CE QUI A CHANGE EN ENTREE" sortie.txt
          grep -q "CHANGEMENTS D'ETAT" sortie.txt
          grep -q "MOUVEMENTS" sortie.txt
          rm -f modifie.csv sortie.txt

      # Les mesures des deux harnais. Pas une baseline qu'on citera plus tard (§16 l'interdit) :
      # de quoi rejouer deux commits et COMPARER deux mesures fraîches avec comparer.ts.
      - name: Publier les mesures brutes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesures-csv
          path: |
            balance.csv
            levier.csv
          if-no-files-found: warn
