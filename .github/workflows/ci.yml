name: CI

# Filet anti-régression : typecheck + tests à chaque push / PR.
on:
  push:
    branches: [main]
  pull_request:
  # Permet de lancer le job e2e Electron à la main (instable en headless,
  # donc pas exécuté sur chaque push).
  workflow_dispatch:

# Le projet vit dans Candio/ (repo multi-apps) → toutes les commandes s'y exécutent.
defaults:
  run:
    working-directory: Candio

jobs:
  desktop:
    name: Desktop — typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Candio/pnpm-lock.yaml

      # postinstall lance `prisma generate` (nécessaire au typecheck/tests).
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: pnpm --filter desktop exec tsc --noEmit

      - name: Tests unitaires (vitest)
        run: pnpm --filter desktop test

  e2e:
    name: Desktop — e2e Electron (manuel)
    # Uniquement sur déclenchement manuel : Electron headless est instable en CI.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Candio/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      # Build de l'app : les tests e2e lancent out/main/index.js.
      - name: Build
        run: pnpm --filter desktop build
      # xvfb : serveur d'affichage virtuel pour la fenêtre Electron.
      - name: Tests e2e (xvfb)
        run: xvfb-run --auto-servernum pnpm --filter desktop test:e2e

  scraper:
    name: Scraper Python — pyflakes (undefined names)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pyflakes
        run: pip install pyflakes

      # Échec uniquement sur les « undefined name » (classe de bug NameError qui
      # casse un run réel sans être vue par les tests). Les autres warnings n'échouent pas.
      - name: pyflakes (undefined names only)
        run: |
          out=$(pyflakes scripts/candio_scraper scripts/scrape_leads.py 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -q "undefined name"; then
            echo "::error::pyflakes a détecté un « undefined name »"
            exit 1
          fi
