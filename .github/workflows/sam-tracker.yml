# SAM Tracker (folder SAM_Tracker/): tests on every change, Windows installer on a release tag.
#
# To publish a new version:
#   1. set __version__ in SAM_Tracker/app/__init__.py (e.g. "1.1.0")
#   2. commit, then:  git tag sam-tracker-v1.1.0  &&  git push origin sam-tracker-v1.1.0
# A few minutes later SAM-Tracker-Setup-1.1.0.exe is on the Releases page.
name: SAM Tracker

on:
  push:
    branches: [main]
    paths: ["SAM_Tracker/**", ".github/workflows/sam-tracker.yml"]
    tags: ["sam-tracker-v*"]
  pull_request:
    paths: ["SAM_Tracker/**", ".github/workflows/sam-tracker.yml"]
  workflow_dispatch:  # manual build from the Actions tab (installer kept as an artifact)

permissions:
  contents: write  # needed to create the release

defaults:
  run:
    working-directory: SAM_Tracker

jobs:
  windows:
    name: Tests + Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Version
        id: version
        shell: bash
        run: |
          version=$(python -c "import app; print(app.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "sam-tracker-v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/__init__.py version $version"
            exit 1
          fi

      - name: Tests
        run: python -m pytest -q

      - name: Build the app (PyInstaller)
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: pyinstaller sam_tracker.spec --noconfirm

      - name: Build the installer (Inno Setup)
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The app's code, installed by install.ps1 and run with the official (signed) Python:
      # works on PCs where Windows "Smart App Control" blocks unsigned programs.
      - name: Build the source ZIP
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        shell: bash
        working-directory: .  # "HEAD:SAM_Tracker" is resolved from the repository root
        run: |
          git archive --format=zip -o "SAM_Tracker/Output/SAM-Tracker-${{ steps.version.outputs.version }}-source.zip" HEAD:SAM_Tracker
          unzip -l "SAM_Tracker/Output/SAM-Tracker-${{ steps.version.outputs.version }}-source.zip" | grep -q launcher.py || { echo "::error::source ZIP is incomplete"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          name: SAM-Tracker-${{ steps.version.outputs.version }}
          path: |
            SAM_Tracker/Output/*.exe
            SAM_Tracker/Output/*.zip

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: SAM Tracker ${{ steps.version.outputs.version }}
          files: |
            SAM_Tracker/Output/*.exe
            SAM_Tracker/Output/*.zip
          body: |
            **Install**: paste this in PowerShell (works even when Windows "Smart App Control" blocks unsigned programs):

            ```powershell
            irm https://raw.githubusercontent.com/jordanduplain-svg/Application_dev/main/SAM_Tracker/install.ps1 | iex
            ```

            Or download `SAM-Tracker-Setup-${{ steps.version.outputs.version }}.exe` below and double-click it.
            If Windows shows "Windows protected your PC", click **More info**, then **Run anyway**.
